name: Stable Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft stable release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and create draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python scripts/check_release_versions.py --print-version)"
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            state="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            test "$state" = "true" || {
              echo "Stable release $tag already exists and is not a draft" >&2
              exit 1
            }
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Arduino Signal Visualizer $tag" \
              --notes-file docs/release-notes-v0.6.0.md \
              --draft
          fi

  desktop:
    name: Desktop bundle (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The action merges each platform into one latest.json asset. Serializing
      # stable builds removes the possibility of concurrent read/modify/write
      # races in that public updater manifest.
      max-parallel: 1
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            # The app target produces the signed .app.tar.gz updater payload;
            # DMG alone is an installer and is not updater-enabled in Tauri.
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_target }}
      - name: Build and attach signed updater package and installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}
          releaseAssetNamePattern: Arduino-Signal-Visualizer-[version]-[platform]-[arch][setup][ext]

  arduino-library:
    name: Arduino IDE library ZIP
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Build deterministic library ZIP
        run: python scripts/package_arduino_library.py --output-dir outputs/release
      - name: Install ZIP and compile every public example
        shell: bash
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/asv-arduino-zip-test"
          config="$test_root/arduino-cli.yaml"
          user_dir="$test_root/user"
          mkdir -p "$user_dir"
          arduino-cli config init --dest-file "$config" --overwrite
          arduino-cli config set directories.user "$user_dir" --config-file "$config"
          arduino-cli config set library.enable_unsafe_install true --config-file "$config"
          arduino-cli lib install \
            --zip-path outputs/release/ArduinoSignalVisualizer-${{ needs.prepare.outputs.version }}.zip \
            --config-file "$config"
          for example in BareMinimum GpioDemo AdcDemo PwmDemo TransparentSerialDemo; do
            arduino-cli compile \
              --fqbn arduino:avr:uno \
              --warnings all \
              --config-file "$config" \
              "$user_dir/libraries/ArduinoSignalVisualizer/examples/$example"
          done
      - name: Attach library ZIP and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release upload "$TAG"
          outputs/release/ArduinoSignalVisualizer-${{ needs.prepare.outputs.version }}.zip
          outputs/release/ArduinoSignalVisualizer-${{ needs.prepare.outputs.version }}.zip.sha256
          --clobber

  audit:
    name: Audit complete draft release
    needs:
      - prepare
      - desktop
      - arduino-library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir release-assets
          gh release download "$TAG" --dir release-assets
      - name: Validate installers, updater manifest, signatures, and ZIP
        run: >-
          python scripts/audit_release_assets.py
          --asset-dir release-assets
          --version ${{ needs.prepare.outputs.version }}
      - name: Attach complete SHA-256 manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release-assets/SHA256SUMS.txt --clobber
      - name: Mark draft ready for human publication
        run: echo "Draft ${{ needs.prepare.outputs.tag }} passed the complete asset audit." >> "$GITHUB_STEP_SUMMARY"
