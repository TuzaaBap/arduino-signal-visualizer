name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check release version consistency
        run: npm run check:versions
      - name: Test stable-release asset audit
        run: python scripts/test_audit_release_assets.py
      - name: Type check
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile desktop application
        run: cargo build --release -p asv-desktop --features custom-protocol

  firmware:
    name: Arduino Uno firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile GPIO example
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/ArduinoSignalVisualizer/examples/GpioDemo
      - name: Compile zero-configuration example
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/ArduinoSignalVisualizer/examples/BareMinimum
      - name: Compile ADC example
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/ArduinoSignalVisualizer/examples/AdcDemo
      - name: Compile PWM example
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/ArduinoSignalVisualizer/examples/PwmDemo
      - name: Compile transparent Serial example
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/ArduinoSignalVisualizer/examples/TransparentSerialDemo
      - name: Compile standard Wire and SPI coexistence (not instrumented)
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/tests/sketches/ArduinoBusLibraryCoexistence
      - name: Compile high-rate six-channel PWM regression
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/tests/sketches/HighRateMultiPwm
      - name: Compile explicit API compatibility test
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/tests/sketches/ExplicitApi
      - name: Compile beginner GPIO burst regression
        run: >-
          arduino-cli compile
          --fqbn arduino:avr:uno
          --library firmware/ArduinoSignalVisualizer
          --warnings all
          firmware/tests/sketches/DigitalBurst
      - name: Compile UART capacity regressions
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            --library firmware/ArduinoSignalVisualizer \
            --warnings all \
            firmware/tests/sketches/SafeMixedStream
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            --library firmware/ArduinoSignalVisualizer \
            --warnings all \
            firmware/tests/sketches/OverloadMixedStream
      - name: Compile school usability matrix
        run: |
          for sketch in firmware/tests/school-sketches/*; do
            arduino-cli compile \
              --fqbn arduino:avr:uno \
              --library firmware/ArduinoSignalVisualizer \
              --warnings all \
              "$sketch"
          done
      - name: Compile native protocol test
        run: >-
          g++ -std=c++11 -Wall -Wextra -Werror
          firmware/tests/native/test_protocol.cpp
          firmware/ArduinoSignalVisualizer/src/AsvProtocol.cpp
          -o /tmp/asv-protocol-test
      - name: Validate shared protocol vector
        run: >-
          /tmp/asv-protocol-test
          protocol/test-vectors/v2-digital-write-d13-high.hex
          protocol/test-vectors/v2-analog-a0-midscale.hex
          protocol/test-vectors/v2-pwm-d9-half-duty.hex
